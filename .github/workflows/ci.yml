name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # A secret reached this public repo once. It does not happen twice.
      - name: Secret guard
        run: |
          set -e
          if git ls-files --error-unmatch '.env' '.env.local' '.env.production' 2>/dev/null; then
            echo "::error::An environment file is tracked in git. Run: git rm --cached <file>"
            exit 1
          fi
          if git ls-files | grep -E '^\.env' ; then
            echo "::error::A dotenv file is tracked in git."
            exit 1
          fi
          if git ls-files | grep -E '\.patch$' ; then
            echo "::error::A .patch artifact is committed. Patches are applied, not stored."
            exit 1
          fi
          if git grep -nIE '(re_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|VERCEL_OIDC_TOKEN=ey|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string is committed."
            exit 1
          fi
          echo "No tracked secrets, dotenv files or patch artifacts."

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The control room's evidence rule is load-bearing: a KPI with a value
      # but no measurement date, an ARCHIVE without a kill-list entry, a
      # scored workflow without evidence — each fails the build here.
      - name: Verify cluster registry integrity
        run: npm run verify:cluster

      - name: Build
        run: npm run build

      # Crawl infrastructure is load-bearing: fail the build if it regresses.
      - name: Assert crawl + identity surfaces exist
        run: |
          set -e
          test -f public/llms.txt
          test -f public/og.png
          test -f public/favicon.ico
          test -f public/.well-known/security.txt
          test -f app/robots.ts
          test -f app/sitemap.ts
          test -f content/cluster/registry.ts
          test -f app/api/cluster/route.ts
          grep -q "api/cluster" public/llms.txt
          python3 - <<'PY'
          from PIL import Image
          w, h = Image.open('public/og.png').size
          assert (w, h) == (1200, 630), f'og.png must be 1200x630, got {w}x{h}'
          print('og.png 1200x630 OK')
          PY

      # The draft rule is the site's integrity guarantee. Assert it, don't trust it.
      - name: Assert draft topics never reach crawlers
        run: |
          set -e
          npx --yes tsx --version >/dev/null 2>&1 || true
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('content/topics').filter(f => f !== 'index.ts');
            const drafts = files.filter(f => /status:\s*'draft'/.test(fs.readFileSync('content/topics/' + f, 'utf8')));
            const slugs = drafts.map(f => (fs.readFileSync('content/topics/' + f, 'utf8').match(/slug:\s*'([^']+)'/) || [])[1]).filter(Boolean);
            if (!slugs.length) { console.log('No draft topics.'); process.exit(0); }
            const sitemap = fs.readFileSync('.next/server/app/sitemap.xml.body', 'utf8');
            const bad = slugs.filter(s => sitemap.includes(s));
            if (bad.length) { console.error('::error::Draft topic(s) leaked into the sitemap: ' + bad.join(', ')); process.exit(1); }
            console.log('Draft topics absent from sitemap: ' + slugs.join(', '));
          "

      - name: Lighthouse CI
        run: |
          npm i -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
